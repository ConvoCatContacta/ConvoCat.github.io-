name: Ingesta diària

# Refresca data/ i el commet a main. Aquest commit dispara el flux de publicació,
# de manera que el lloc es reconstrueix només quan les dades han canviat de veritat.

on:
  schedule:
    # 04:00 UTC = 06:00 a Catalunya a l'estiu, 05:00 a l'hivern.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    outputs:
      canvis: ${{ steps.commit.outputs.canvis }}
    # Són ~11.600 peticions de detall a BDNS a ritme educat: no és un flux ràpid.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ingest
        env:
          # Si el secret no hi és, la ingesta continua i les fitxes es publiquen sense paràgraf.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Es fa abans del commit perquè el diff és contra l'estat que encara hi ha al repo.
      - name: Prepara el butlletí de novetats
        run: npm run butlleti
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}

      - name: Comprova que el resultat té sentit
        run: |
          node -e "
            const m = require('./data/meta.json');
            console.log(JSON.stringify(m, null, 2));
            if (!m.total || m.total < 100) {
              console.error('::error::Només ' + m.total + ' convocatòries: alguna font ha fallat.');
              process.exit(1);
            }
            if (!m.obertes) {
              console.error('::error::Cap convocatòria oberta: no publiquem un lloc buit.');
              process.exit(1);
            }
          "

      - name: Commet les dades si han canviat
        id: commit
        run: |
          git config user.name 'convocat-bot'
          git config user.email 'noreply@github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "Sense canvis a les dades; no cal commit."
            echo "canvis=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          obertes=$(node -p "require('./data/meta.json').obertes")
          git commit -m "Dades: $(date -u +%Y-%m-%d) · ${obertes} convocatòries obertes"

          # La ingesta dura uns 25 minuts i main pot haver avançat mentrestant. Sense rebasar,
          # el push es rebutja i es perd tota la feina de l'execució, resums pagats inclosos.
          # Només toquem data/, que no edita ningú més, així que el rebase no ha de xocar.
          for intent in 1 2 3; do
            if git push; then
              echo "canvis=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rebutjat (intent $intent): main ha avançat. Rebasant."
            git pull --rebase origin main
          done

          echo "::error::No s'han pogut publicar les dades després de tres intents."
          exit 1

  # Cridat explícitament perquè el push del bot no dispara cap flux pel seu compte.
  desplega:
    needs: ingesta
    if: needs.ingesta.outputs.canvis == 'true'
    uses: ./.github/workflows/desplega.yml
    permissions:
      contents: read
      pages: write
      id-token: write
