name: Desplega a GitHub Pages

# El lloc es construeix amb Astro, no amb Jekyll. Perquè això funcioni, a
# Settings > Pages l'origen ha de ser "GitHub Actions" i no "Deploy from a branch":
# amb l'origen per branca, Pages executa el Jekyll per defecte sobre l'arrel del repo i falla.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # El flux d'ingesta crida aquest directament. Un commit fet amb el GITHUB_TOKEN per defecte
  # NO dispara cap altre flux (és la protecció contra bucles infinits de GitHub), així que
  # confiar en el trigger de push deixaria les dades noves sense publicar.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicació a la vegada, i deixem acabar la que ja estigui en curs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construeix:
    runs-on: ubuntu-latest
    steps:
      # Sempre la punta de main: quan ens crida la ingesta, el commit de dades que acaba de
      # fer és més nou que el SHA que va disparar aquella execució.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprova que hi ha dades
        run: |
          if [ ! -s data/convocatories.json ]; then
            echo "::error::data/convocatories.json no existeix o és buit. Executa el flux d'ingesta abans de publicar."
            exit 1
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publica:
    needs: construeix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - id: desplegament
        uses: actions/deploy-pages@v4
